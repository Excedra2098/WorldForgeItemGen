name: Build WorldForgeItemGen (Java 25)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin against Paper API
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests
      - name: Verify plugin descriptor is bundled
        run: |
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*sources*' | head -1)
          test -n "$JAR"
          jar tf "$JAR" | grep -qx 'plugin.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: WorldForgeItemGen-2.21.3-boundary-calibration-UNTESTED
          path: target/*.jar
          if-no-files-found: error
